<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Received - Little Lemon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fcfbf7;
      color: #333;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .card {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      padding: 35px 25px;
      border: 1px solid #bbf7d0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 10px; }
    h1 { color: #166534; font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #4b5563; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.6; }
    a {
      display: inline-block;
      color: #ffffff;
      background-color: #f59e0b;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a:hover { background-color: #d97706; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Reservation Received!</h1>
    <p>
      Thank you for booking a table with Little Lemon. We look forward to serving you!
    </p>

    <a href="home.html">← Back to Home</a>
  </div>
</body>
</html>
